<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TWRP Theme Studio</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="preview" class="preview"></div>
    <!-- Floating edit button -->
    <button id="editBtn" class="edit-btn">&#9998;</button>
    <!-- Edit panel (hidden by default) -->
    <div id="editPanel" class="edit-panel hidden">
        <h2>Theme Editor</h2>
        <div id="colorControls"></div>
        <div id="imageControls"></div>
        <button id="saveBtn" class="save-btn">Save to source</button>
        <button id="closeBtn" class="close-btn">Close</button>
    </div>
    <script src="themeParser.js"></script>
    <script src="app.js"></script>
</body>
</html>
